name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # On failure, the summary lines also go out as an annotation, which the check run shows
      # without signing in.
      - run: |
          $ErrorActionPreference = "Stop"
          python -m pytest tests -rfEs --tb=line 2>&1 | Tee-Object pytest.log
          if ($LASTEXITCODE -ne 0) {
            $msg = ((Select-String -Path pytest.log -Pattern '^(FAILED|ERROR) |\.py:[0-9]+: ' |
              Select-Object -First 60 -ExpandProperty Line) -replace "%", "%25") -join "%0A"
            "::error title=pytest::$msg"
            exit $LASTEXITCODE
          }
        env:
          COLUMNS: "200"
          # The PowerShell tests (marker `powershell`) check the hook's PowerShell text, and
          # each launches PowerShell several times: one Python of the matrix runs them.
          PYTEST_ADDOPTS: ${{ matrix.python == '3.10' && '-m "not powershell"' || '' }}
